# The merchant onboarding wizard (https://conecta.agentposhq.com): the "conecta tu tienda en 15
# minutos" the landing promises, on a public host instead of the founder's laptop.
#
# From the monorepo root on the server:
#   docker network create edge 2>/dev/null; \
#   docker compose -f apps/merchant-web/deploy/docker-compose.prod.yml up -d --build
#
# There is no env file and no secret to pass: this service is stateless. No database, no
# volume, no wallet key, no facilitator key, no account. It reads exactly one variable, PORT,
# and that one is pinned here because the Caddy block proxies to it. The container is never
# published to the host: the single Caddy from the facilitator deploy fronts it over the shared
# external `edge` network and terminates TLS.
#
# What this service holds while a merchant uses it: nothing. The WooCommerce keys, the wallet
# address and the generated MERCHANT_API_TOKEN live for the duration of one request and are
# never written or logged. That is why there is nothing here to back up and nothing to rotate.
services:
  merchant-web:
    build:
      context: ../../..
      dockerfile: apps/merchant-web/deploy/Dockerfile
    image: agentpos-merchant-web:prod
    restart: unless-stopped
    environment:
      # The only variable apps/merchant-web/src/server.ts reads. Pinned, not operator-tunable:
      # the Dockerfile EXPOSEs it and the Caddy block proxies to it.
      PORT: "8410"
    expose:
      - "8410"
    networks: [edge]

networks:
  edge:
    external: true
