name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history, guardrail 9)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  smoke-testnet:
    # Real Stellar testnet transaction (friendbot + trustline + payment). Runs on main only.
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e:smoke
        env:
          AGENTGATE_NETWORK: testnet

  gate-g1:
    # Production gate report (docs/GATE-G1.md). Mainnet stays locked until this is green
    # and the founder flips MAINNET_READY.
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      AGENTGATE_NETWORK: testnet
      AGENTGATE_FACILITATOR_API_KEY: ${{ secrets.AGENTGATE_FACILITATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm gate:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-g1-report
          path: docs/gate-g1.report.json

  e2e-testnet:
    # Full loop: WooCommerce demo store in docker + real facilitator settlement on testnet.
    # Needs the AGENTGATE_FACILITATOR_API_KEY repository secret; skipped when absent.
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      AGENTGATE_NETWORK: testnet
      AGENTGATE_CHECKOUT_ASSET: XLM
      AGENTGATE_FACILITATOR_API_KEY: ${{ secrets.AGENTGATE_FACILITATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start demo store
        run: |
          pnpm demo:up
          for i in $(seq 1 60); do
            docker compose -f apps/demo-store/docker-compose.yml logs wpcli 2>/dev/null | grep -q "\[seed\] done" && break
            sleep 5
          done
          docker compose -f apps/demo-store/docker-compose.yml logs wpcli | tail -3
      - name: Agent buys on testnet
        if: ${{ env.AGENTGATE_FACILITATOR_API_KEY != '' }}
        run: pnpm e2e:testnet
