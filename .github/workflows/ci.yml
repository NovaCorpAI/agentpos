name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Maintainers can run the testnet jobs on a branch before merging (they need repo secrets).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history, guardrail 9)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  contracts:
    # Soroban contracts of the mandate (contracts/): format, lint, WASM build, then the
    # acceptance matrix, the adversarial tests, the model test and the storage lifetime
    # tests. Mutation testing runs apart, in mutants.yml. The suite runs twice:
    # against the native contracts and against the built WASM, which is what gets deployed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - uses: stellar/stellar-cli@v30.0.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Build WASM
        run: |
          stellar contract build
          sha256sum target/wasm32v1-none/release/*.wasm
      - name: Acceptance matrix (every accept path and every rejection)
        run: cargo test -p agentpos-mandate-policy --test mandate_matrix -- --test-threads=1
      - name: Adversarial tests
        run: cargo test -p agentpos-mandate-policy --test mandate_adversarial -- --test-threads=1
      - name: Model test (random sequences against a reference model)
        run: cargo test -p agentpos-mandate-policy --test mandate_model -- --nocapture
      - name: Storage lifetime tests
        run: cargo test -p agentpos-mandate-policy --test mandate_storage -- --test-threads=1
      - name: Same suite against the WASM artifacts, with the metered costs
        env:
          AGENTPOS_WASM_DIR: ${{ github.workspace }}/contracts/target/wasm32v1-none/release
        run: cargo test --workspace -- --nocapture --test-threads=1

  spike-stellar8004:
    # Registers an agent, gives feedback and reads the summary on Stellar 8004 testnet,
    # with throwaway keys. Real network calls, so it runs on main only.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/stellar8004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run spike

  smoke-testnet:
    # Real Stellar testnet transaction (friendbot + trustline + payment). Runs on main only.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e:smoke
        env:
          AGENTPOS_NETWORK: testnet

  gate-g1:
    # Production gate report (docs/GATE-G1.md). Mainnet stays locked until this is green
    # and the founder flips MAINNET_READY.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      AGENTPOS_NETWORK: testnet
      AGENTPOS_FACILITATOR_API_KEY: ${{ secrets.AGENTPOS_FACILITATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm gate:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-g1-report
          path: docs/gate-g1.report.json

  e2e-testnet:
    # Full loop: WooCommerce demo store in docker + real facilitator settlement on testnet.
    # Needs the AGENTPOS_FACILITATOR_API_KEY repository secret; skipped when absent.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      AGENTPOS_NETWORK: testnet
      AGENTPOS_CHECKOUT_ASSET: XLM
      AGENTPOS_FACILITATOR_API_KEY: ${{ secrets.AGENTPOS_FACILITATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start demo store
        run: |
          pnpm demo:up
          for i in $(seq 1 60); do
            docker compose -f apps/demo-store/docker-compose.yml logs wpcli 2>/dev/null | grep -q "\[seed\] done" && break
            sleep 5
          done
          docker compose -f apps/demo-store/docker-compose.yml logs wpcli | tail -3
      - name: Agent buys on testnet
        if: ${{ env.AGENTPOS_FACILITATOR_API_KEY != '' }}
        run: pnpm e2e:testnet
