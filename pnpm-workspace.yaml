packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.68.0"
  - "@typescript-eslint/parser@8.68.0"
  - "@typescript-eslint/project-service@8.68.0"
  - "@typescript-eslint/scope-manager@8.68.0"
  - "@typescript-eslint/tsconfig-utils@8.68.0"
  - "@typescript-eslint/type-utils@8.68.0"
  - "@typescript-eslint/types@8.68.0"
  - "@typescript-eslint/typescript-estree@8.68.0"
  - "@typescript-eslint/utils@8.68.0"
  - "@typescript-eslint/visitor-keys@8.68.0"
  - eslint@10.9.1
  - typescript-eslint@8.68.0
overrides:
  # qs (transitive via @modelcontextprotocol/sdk > express): GHSA-4mjr-xmp4-gh2g (< 6.16.0) and
  # GHSA-6pq8-jhm2-2vcw (<= 6.16.0, DoS in stringify with arrayFormat comma), patched in 6.16.1.
  qs: ">=6.16.1"
  # axios < 1.20.0 (transitive via @stellar/stellar-sdk): ReDoS and prototype-pollution advisories.
  axios: ">=1.20.0"
  # Transitive advisories reported by pnpm audit --prod on 2026-10-26 (gate G1, check "audit").
  # zod < 4.6.6 (GHSA-mrhx-c7xc-m3w5): memory exhaustion on oversized arrays. The 3.x line has
  # no patch, and @x402/core 2.28.0 asks for ^3.24.2 while using only APIs that are identical in
  # zod 4 (object, string, union, discriminatedUnion, record, custom), so it is moved to 4.x.
  zod@<4.6.6: ">=4.6.6 <5"
  # body-parser 2.x < 2.4.0 (via @modelcontextprotocol/sdk > express): DoS via trailing bytes.
  body-parser@>=2.0.0 <2.4.0: ">=2.4.0 <3"
  # undici 7.x < 7.30.1 (via cheerio): DoS and SRI bypass advisories.
  undici@>=7.0.0 <7.30.1: ">=7.30.1 <8"
  # fast-uri 3.x < 3.1.9 (via ajv): scheme spoofing and host confusion advisories.
  fast-uri@>=3.0.0 <3.1.9: ">=3.1.9 <4"
