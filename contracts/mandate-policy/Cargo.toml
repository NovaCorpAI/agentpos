[package]
name = "agentpos-mandate-policy"
description = "The AgentPOS mandate as a smart account policy: cap per payment, cap per period, seller allowlist."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
agentpos-mandate-account = { path = "../mandate-account" }
agentpos-ed25519-verifier = { path = "../ed25519-verifier" }
ed25519-dalek = "2.1.1"
